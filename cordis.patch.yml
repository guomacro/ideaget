# ideaget bundle layer. Row ids are stable patch targets (user layers override
# by id). The paper-RAG framework rows are skeleton plugins mounted as their
# own entries; their Config values are defaults to be refined later.
- insert:
    - id: ideaget
      name: ideaget
      config: {}

    # ── paper-RAG framework (skeleton stage) ──
    - id: ideaget-ingest
      name: 'ideaget/rag/ingest'
      config: {}
    - id: ideaget-graph
      name: 'ideaget/rag/graph'
      config: {}
    - id: ideaget-rag
      name: 'ideaget/rag/rag'
      config: {}
    - id: ideaget-router
      name: 'ideaget/rag/router'
      config: {}
